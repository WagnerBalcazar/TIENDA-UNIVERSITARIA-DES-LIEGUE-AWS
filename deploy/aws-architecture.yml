AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Tienda Universitaria web stack matching ABP_Nube: public ALB, EC2 Auto Scaling
  across two AZs, private PostgreSQL Multi-AZ, private S3 bucket and single NAT.

Parameters:
  VpcName:
    Type: String
    Default: tienda-universitaria
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium, t3.large]
    Description: Two instances run continuously; t3.small is the lowest permitted size.
  UbuntuAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Ubuntu 24.04 AMI ID resolved from the public SSM parameter for this region.
  KeyPairName:
    Type: String
    Default: ''
    Description: Optional EC2 key pair. Prefer SSM Session Manager instead of SSH.
  GitRepository:
    Type: String
    Default: https://github.com/KerlyHS/TiendaUniversitaria.git
  GitBranch:
    Type: String
    Default: main
  CertificateArn:
    Type: String
    Description: ACM certificate ARN validated for PublicDomainName in this AWS region.
  PublicDomainName:
    Type: String
    Description: DNS name whose A/ALIAS record will point to the ALB.
  DatabaseName:
    Type: String
    Default: tienda
    AllowedPattern: '^[A-Za-z][A-Za-z0-9_]*$'
  DatabaseUsername:
    Type: String
    Default: tienda_app
    AllowedPattern: '^[A-Za-z][A-Za-z0-9_]*$'
  DatabasePasswordParameterName:
    Type: String
    Default: /tienda/prod/database-password
    Description: Existing SSM SecureString parameter, alphanumeric value recommended.
  DjangoSecretParameterName:
    Type: String
    Default: /tienda/prod/django-secret-key
    Description: Existing SSM SecureString parameter containing Django SECRET_KEY.
  StripeSecretParameterName:
    Type: String
    Default: /tienda/prod/stripe-secret-key
    Description: Existing SSM SecureString parameter; can contain a test key initially.

Conditions:
  HasKeyPair: !Not [!Equals [!Ref KeyPairName, '']]

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Ref VpcName}]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Name, Value: !Sub '${VpcName}-igw'}]
  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: !Sub '${VpcName}-pub-a'}]
  PublicB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: !Sub '${VpcName}-pub-b'}]
  AppA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.11.0/24
      Tags: [{Key: Name, Value: !Sub '${VpcName}-app-a'}]
  AppB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.12.0/24
      Tags: [{Key: Name, Value: !Sub '${VpcName}-app-b'}]
  DataA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.0.21.0/24
      Tags: [{Key: Name, Value: !Sub '${VpcName}-bd-a'}]
  DataB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.0.22.0/24
      Tags: [{Key: Name, Value: !Sub '${VpcName}-bd-b'}]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags: [{Key: Name, Value: !Sub '${VpcName}-rt-publica'}]
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicA, RouteTableId: !Ref PublicRouteTable}
  PublicAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicB, RouteTableId: !Ref PublicRouteTable}

  NatEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags: [{Key: Name, Value: !Sub '${VpcName}-nat-eip'}]
  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: AttachGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicA
      Tags: [{Key: Name, Value: !Sub '${VpcName}-nat'}]

  AppRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags: [{Key: Name, Value: !Sub '${VpcName}-rt-app'}]
  AppInternetRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref AppRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
  AppAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref AppA, RouteTableId: !Ref AppRouteTable}
  AppAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref AppB, RouteTableId: !Ref AppRouteTable}

  DataRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags: [{Key: Name, Value: !Sub '${VpcName}-rt-datos'}]
  DataAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref DataA, RouteTableId: !Ref DataRouteTable}
  DataAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref DataB, RouteTableId: !Ref DataRouteTable}

  PublicNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref VPC
      Tags: [{Key: Name, Value: !Sub '${VpcName}-nacl-publica'}]
  PublicNaclA:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {SubnetId: !Ref PublicA, NetworkAclId: !Ref PublicNacl}
  PublicNaclB:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {SubnetId: !Ref PublicB, NetworkAclId: !Ref PublicNacl}
  PublicNaclIngressWeb:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNacl
      RuleNumber: 100
      Protocol: '6'
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange: {From: 80, To: 80}
  PublicNaclIngressTls:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNacl
      RuleNumber: 110
      Protocol: '6'
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange: {From: 443, To: 443}
  PublicNaclIngressEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNacl
      RuleNumber: 120
      Protocol: '6'
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange: {From: 1024, To: 65535}
  PublicNaclEgressWeb:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNacl
      RuleNumber: 100
      Protocol: '6'
      RuleAction: allow
      Egress: true
      CidrBlock: 10.0.0.0/16
      PortRange: {From: 80, To: 8000}
  PublicNaclEgressTls:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNacl
      RuleNumber: 110
      Protocol: '6'
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0
      PortRange: {From: 443, To: 443}
  PublicNaclEgressEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNacl
      RuleNumber: 120
      Protocol: '6'
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0
      PortRange: {From: 1024, To: 65535}

  AppNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref VPC
      Tags: [{Key: Name, Value: !Sub '${VpcName}-nacl-app'}]
  AppNaclA:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {SubnetId: !Ref AppA, NetworkAclId: !Ref AppNacl}
  AppNaclB:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {SubnetId: !Ref AppB, NetworkAclId: !Ref AppNacl}
  AppNaclIngressWeb:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref AppNacl
      RuleNumber: 100
      Protocol: '6'
      RuleAction: allow
      Egress: false
      CidrBlock: 10.0.1.0/24
      PortRange: {From: 80, To: 8000}
  AppNaclIngressWebB:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref AppNacl
      RuleNumber: 110
      Protocol: '6'
      RuleAction: allow
      Egress: false
      CidrBlock: 10.0.2.0/24
      PortRange: {From: 80, To: 8000}
  AppNaclIngressEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref AppNacl
      RuleNumber: 120
      Protocol: '6'
      RuleAction: allow
      Egress: false
      CidrBlock: 10.0.0.0/16
      PortRange: {From: 1024, To: 65535}
  AppNaclEgressPostgres:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref AppNacl
      RuleNumber: 100
      Protocol: '6'
      RuleAction: allow
      Egress: true
      CidrBlock: 10.0.21.0/24
      PortRange: {From: 5432, To: 5432}
  AppNaclEgressPostgresB:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref AppNacl
      RuleNumber: 110
      Protocol: '6'
      RuleAction: allow
      Egress: true
      CidrBlock: 10.0.22.0/24
      PortRange: {From: 5432, To: 5432}
  AppNaclEgressTls:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref AppNacl
      RuleNumber: 120
      Protocol: '6'
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0
      PortRange: {From: 443, To: 443}
  AppNaclEgressHttp:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref AppNacl
      RuleNumber: 125
      Protocol: '6'
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0
      PortRange: {From: 80, To: 80}
  AppNaclEgressEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref AppNacl
      RuleNumber: 130
      Protocol: '6'
      RuleAction: allow
      Egress: true
      CidrBlock: 10.0.0.0/16
      PortRange: {From: 1024, To: 65535}
  AppNaclEgressEphemeralInternet:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref AppNacl
      RuleNumber: 140
      Protocol: '6'
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0
      PortRange: {From: 1024, To: 65535}

  DataNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref VPC
      Tags: [{Key: Name, Value: !Sub '${VpcName}-nacl-datos'}]
  DataNaclA:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {SubnetId: !Ref DataA, NetworkAclId: !Ref DataNacl}
  DataNaclB:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {SubnetId: !Ref DataB, NetworkAclId: !Ref DataNacl}
  DataNaclIngressPostgresA:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DataNacl
      RuleNumber: 100
      Protocol: '6'
      RuleAction: allow
      Egress: false
      CidrBlock: 10.0.11.0/24
      PortRange: {From: 5432, To: 5432}
  DataNaclIngressPostgresB:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DataNacl
      RuleNumber: 110
      Protocol: '6'
      RuleAction: allow
      Egress: false
      CidrBlock: 10.0.12.0/24
      PortRange: {From: 5432, To: 5432}
  DataNaclEgressEphemeralA:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DataNacl
      RuleNumber: 100
      Protocol: '6'
      RuleAction: allow
      Egress: true
      CidrBlock: 10.0.11.0/24
      PortRange: {From: 1024, To: 65535}
  DataNaclEgressEphemeralB:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DataNacl
      RuleNumber: 110
      Protocol: '6'
      RuleAction: allow
      Egress: true
      CidrBlock: 10.0.12.0/24
      PortRange: {From: 1024, To: 65535}

  S3Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref AppRouteTable]

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP/HTTPS to ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App instances accept web traffic only from ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, SourceSecurityGroupId: !Ref AlbSecurityGroup}
        - {IpProtocol: tcp, FromPort: 8000, ToPort: 8000, SourceSecurityGroupId: !Ref AlbSecurityGroup}
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL accessible only from app instances
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AppSecurityGroup}

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets: [!Ref PublicA, !Ref PublicB]
  AppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VPC
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckPath: /api/v1/productos/
      Matcher: {HttpCode: '200-399'}
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      HealthCheckIntervalSeconds: 30
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: {Protocol: HTTPS, Port: '443', StatusCode: HTTP_301}
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 443
      Protocol: HTTPS
      Certificates: [{CertificateArn: !Ref CertificateArn}]
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref AppTargetGroup}]

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private data subnets in two AZs
      SubnetIds: [!Ref DataA, !Ref DataB]
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: 20
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: true
      PubliclyAccessible: false
      DBName: !Ref DatabaseName
      MasterUsername: !Ref DatabaseUsername
      MasterUserPassword: !Sub '{{resolve:ssm-secure:${DatabasePasswordParameterName}:1}}'
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      BackupRetentionPeriod: 7
      AutoMinorVersionUpgrade: true
      DeletionProtection: true

  AppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadAppParametersAndWriteProductImages
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameter]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DjangoSecretParameterName}'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${StripeSecretParameterName}'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatabasePasswordParameterName}'
              - Effect: Allow
                Action: [kms:Decrypt]
                Resource: '*'
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${S3Bucket.Arn}/*'
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt S3Bucket.Arn
  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref AppRole]

  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref UbuntuAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile: {Arn: !GetAtt AppInstanceProfile.Arn}
        SecurityGroupIds: [!Ref AppSecurityGroup]
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeSize: 20
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            exec > >(tee /var/log/tienda-bootstrap.log) 2>&1
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y git awscli curl
            curl -fsSL https://get.docker.com | sh
            systemctl enable --now docker
            usermod -aG docker ubuntu
            fallocate -l 2G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
            git clone --depth 1 --branch '${GitBranch}' '${GitRepository}' /opt/tienda
            chmod 755 /opt/tienda
            DB_PASSWORD=$(aws ssm get-parameter --region '${AWS::Region}' --name '${DatabasePasswordParameterName}' --with-decryption --query Parameter.Value --output text)
            DJANGO_SECRET=$(aws ssm get-parameter --region '${AWS::Region}' --name '${DjangoSecretParameterName}' --with-decryption --query Parameter.Value --output text)
            STRIPE_SECRET=$(aws ssm get-parameter --region '${AWS::Region}' --name '${StripeSecretParameterName}' --with-decryption --query Parameter.Value --output text)
            cat > /opt/tienda/.env <<EOF
            DEBUG=False
            SECRET_KEY=$DJANGO_SECRET
            STRIPE_SECRET_KEY=$STRIPE_SECRET
            STRIPE_WEBHOOK_SECRET=
            DATABASE_URL=postgres://${DatabaseUsername}:$DB_PASSWORD@${Database.Endpoint.Address}:5432/${DatabaseName}
            ALLOWED_HOSTS=${Alb.DNSName},${PublicDomainName}
            CSRF_TRUSTED_ORIGINS=https://${PublicDomainName}
            AWS_STORAGE_BUCKET_NAME=${S3Bucket}
            AWS_S3_REGION_NAME=${AWS::Region}
            FRONTEND_URL=https://${PublicDomainName}
            SECURE_SSL_REDIRECT=True
            EOF
            chmod 600 /opt/tienda/.env
            cd /opt/tienda
            docker compose -f docker-compose.ec2.yml up -d --build
        KeyName: !If [HasKeyPair, !Ref KeyPairName, !Ref 'AWS::NoValue']

  AppAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      MinSize: '2'
      DesiredCapacity: '2'
      MaxSize: '4'
      VPCZoneIdentifier: [!Ref AppA, !Ref AppB]
      TargetGroupARNs: [!Ref AppTargetGroup]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 900
      LaunchTemplate:
        LaunchTemplateId: !Ref AppLaunchTemplate
        Version: !GetAtt AppLaunchTemplate.LatestVersionNumber
      Tags:
        - {Key: Name, Value: !Sub '${VpcName}-app', PropagateAtLaunch: true}
  AppScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AppAutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification: {PredefinedMetricType: ASGAverageCPUUtilization}
        TargetValue: 60

Outputs:
  WebsiteUrl:
    Description: Create a DNS A/ALIAS record from PublicDomainName to LoadBalancerDnsName.
    Value: !Sub 'https://${PublicDomainName}'
  LoadBalancerDnsName:
    Value: !GetAtt Alb.DNSName
  BucketName:
    Value: !Ref S3Bucket
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  VpcId:
    Value: !Ref VPC
